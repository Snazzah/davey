name: "[davey-python] Release to PyPI"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    uses: ./.github/workflows/python-test.yml
    secrets: inherit

  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.current_version }}
      cargo_version: ${{ steps.get_version.outputs.cargo_version }}
      prerelease: ${{ steps.get_version.outputs.prerelease }}
    defaults:
      run:
        working-directory: davey-python
    steps:
      - uses: actions/checkout@v7
      - name: Use Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Get current version
        id: get_version
        run: |
            cargo_version="$(uvx --from=toml-cli toml get --toml-path=Cargo.toml package.version)"
            echo "cargo_version=${cargo_version}" >> "$GITHUB_OUTPUT"
            # Normalize like maturin does (e.g. 0.2.0-beta -> 0.2.0b0)
            uv run --no-project --with packaging python - "$cargo_version" >> "$GITHUB_OUTPUT" <<'EOF'
            import sys
            from packaging.version import Version
            version = Version(sys.argv[1])
            print(f"current_version={version}")
            print(f"prerelease={str(version.is_prerelease).lower()}")
            EOF

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: davey-python
    permissions:
      # Use to sign the release artifacts
      id-token: write
      contents: read
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*

  release:
    name: Create release
    needs: [get_version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Pull changelog
        run: .github/scripts/changelog-section.sh davey-python/CHANGELOG.md "${{ needs.get_version.outputs.version }}" "${{ needs.get_version.outputs.cargo_version }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "py-${{ needs.get_version.outputs.version }}"
          name: "davey-python@${{ needs.get_version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ needs.get_version.outputs.prerelease }}
